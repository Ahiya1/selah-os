strategy: |
  Single iteration to simplify SelahOS down to the Ground Phase.
  This is a subtraction project: more code removed than added.

  Key changes:
  1. Remove Project and Signals pages, hooks, and tests
  2. Restrict Ground page to weekly-only access (remove from daily nav)
  3. Convert anchor state from boolean to 3-state (done/not-done/untouched)
  4. Update navigation to Today-only
  5. Database migration: boolean NOT NULL → boolean NULL

  Critical dependency: use-active-project-name is imported by Today page.
  Must be removed atomically with page update.

  Database migration must run before new code deploys.
  Existing false values become NULL (untouched semantics).

